# RaSQL engine matrix. Every engine the bundled drivers claim to support.
# Start with:  pnpm matrix:up      Stop with:  pnpm matrix:down
# Each family gets its own fixture (fixtures/mysql, fixtures/postgres, fixtures/mssql) and the
# same credentials:
#
#   user: rasql   password: rasql   database: rasql   root password: root
#   SQL Server: sa's password is Root-2024!, which its password policy accepts
#
# Ports never clash with a local server: 33000 + a mnemonic of the version for MySQL and
# MariaDB, 35400 + the major version for PostgreSQL, 16000 + the last two digits of the year for SQL Server.

x-env: &env
  MYSQL_ROOT_PASSWORD: root
  MYSQL_DATABASE: rasql
  MYSQL_USER: rasql
  MYSQL_PASSWORD: rasql

x-mariadb-env: &mariadb-env
  MARIADB_ROOT_PASSWORD: root
  MARIADB_DATABASE: rasql
  MARIADB_USER: rasql
  MARIADB_PASSWORD: rasql

x-postgres-env: &postgres-env
  POSTGRES_USER: rasql
  POSTGRES_PASSWORD: rasql
  POSTGRES_DB: rasql

x-postgres-healthcheck:
  &postgres-healthcheck # TCP on purpose: during init the server listens on its socket only.
  test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U rasql -d rasql']
  interval: 2s
  timeout: 3s
  start_period: 60s
  retries: 100

x-mssql: &mssql
  platform: linux/amd64 # Microsoft publishes no arm64 image; runs under emulation on Apple Silicon
  environment:
    ACCEPT_EULA: 'Y'
    MSSQL_PID: Developer
    MSSQL_SA_PASSWORD: Root-2024!
  # No init-script directory in this image: init.sh starts the server and loads the fixture.
  entrypoint: ['/bin/bash', '/fixtures/init.sh']
  volumes: ['./fixtures/mssql:/fixtures:ro']
  healthcheck:
    test: ['CMD-SHELL', 'test -f /tmp/rasql-ready']
    interval: 3s
    timeout: 3s
    start_period: 120s
    retries: 100

x-healthcheck: &healthcheck
  test:
    [
      'CMD-SHELL',
      'mysqladmin ping -h 127.0.0.1 -uroot -proot --silent || mariadb-admin ping -h 127.0.0.1 -uroot -proot --silent',
    ]
  interval: 3s
  timeout: 3s
  # Loading the fixture (100 000 generated rows) takes a while on a cold runner; be patient.
  start_period: 60s
  retries: 100

services:
  mysql57:
    image: mysql:5.7
    platform: linux/amd64 # no arm64 image exists for 5.7; runs under emulation
    environment: *env
    command: ['--character-set-server=utf8mb4', '--collation-server=utf8mb4_unicode_ci']
    ports: ['33057:3306']
    volumes: ['./fixtures/mysql:/docker-entrypoint-initdb.d:ro']
    healthcheck: *healthcheck

  mysql80:
    image: mysql:8.0
    environment: *env
    command: ['--character-set-server=utf8mb4', '--collation-server=utf8mb4_0900_ai_ci']
    ports: ['33080:3306']
    volumes: ['./fixtures/mysql:/docker-entrypoint-initdb.d:ro']
    healthcheck: *healthcheck

  mysql84:
    image: mysql:8.4
    environment: *env
    command: ['--character-set-server=utf8mb4', '--collation-server=utf8mb4_0900_ai_ci']
    ports: ['33084:3306']
    volumes: ['./fixtures/mysql:/docker-entrypoint-initdb.d:ro']
    healthcheck: *healthcheck

  mariadb106:
    image: mariadb:10.6
    environment: *mariadb-env
    ports: ['33106:3306']
    volumes: ['./fixtures/mysql:/docker-entrypoint-initdb.d:ro']
    healthcheck: *healthcheck

  mariadb1011:
    image: mariadb:10.11
    environment: *mariadb-env
    ports: ['33111:3306']
    volumes: ['./fixtures/mysql:/docker-entrypoint-initdb.d:ro']
    healthcheck: *healthcheck

  mariadb114:
    image: mariadb:11.4
    environment: *mariadb-env
    ports: ['33114:3306']
    volumes: ['./fixtures/mysql:/docker-entrypoint-initdb.d:ro']
    healthcheck: *healthcheck

  percona80:
    image: percona/percona-server:8.0
    environment: *env
    ports: ['33880:3306']
    volumes: ['./fixtures/mysql:/docker-entrypoint-initdb.d:ro']
    healthcheck: *healthcheck

  postgres13:
    image: postgres:13-alpine
    environment: *postgres-env
    ports: ['35413:5432']
    volumes: ['./fixtures/postgres:/docker-entrypoint-initdb.d:ro']
    healthcheck: *postgres-healthcheck

  postgres16:
    image: postgres:16-alpine
    environment: *postgres-env
    ports: ['35416:5432']
    volumes: ['./fixtures/postgres:/docker-entrypoint-initdb.d:ro']
    healthcheck: *postgres-healthcheck

  postgres18:
    image: postgres:18-alpine
    environment: *postgres-env
    ports: ['35418:5432']
    volumes: ['./fixtures/postgres:/docker-entrypoint-initdb.d:ro']
    healthcheck: *postgres-healthcheck

  mssql2019:
    <<: *mssql
    image: mcr.microsoft.com/mssql/server:2019-latest
    ports: ['16019:1433']

  mssql2022:
    <<: *mssql
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports: ['16022:1433']

  mssql2025:
    <<: *mssql
    image: mcr.microsoft.com/mssql/server:2025-latest
    ports: ['16025:1433']
