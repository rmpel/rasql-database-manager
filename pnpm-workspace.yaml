packages:
  - packages/*

# pnpm refuses to run install scripts unless they are listed. Everything here is a build
# tool or Electron itself; nothing from a database driver runs a script.
allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
  '@parcel/watcher': true
  '@swc/core': true
  sass-embedded: true
  # ssh2's optional cpu-features binding is never needed; pure JS is fine.
  ssh2: false
  cpu-features: false

# Install native binaries for both CPU types of the host OS. A pnpm that runs under emulation
# (the standalone pnpm on Windows on ARM, or Rosetta on macOS) then still installs what the
# project's own Node needs. Costs a few tens of megabytes per workspace.
supportedArchitectures:
  os: [current]
  cpu: [x64, arm64]
