appId: nl.remonpel.rasql
productName: RaSQL
# The package is @rasql/app; artifacts must not be named after it (the deb builder would write into
# release/@rasql/). Names carry the OS too, so the nightly release can merge all platforms' files.
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
# Likewise the executable: without this it would be derived from the package name too.
executableName: RaSQL
copyright: Copyright © 2026 Remon Pel. GPL-3.0-or-later.
directories:
  output: release
  buildResources: build
# Everything the app needs is bundled into out/ by electron-vite. The one exception is the
# native keychain binding, which cannot be bundled and ships unpacked (docs/DECISIONS.md D-22).
files:
  - out/**
  - package.json
  - node_modules/@napi-rs/keyring/**
  - node_modules/@napi-rs/keyring-*/**
extraResources:
  - from: ../localwp-addon/dist
    to: localwp-addon
  - from: build/icon.png
    to: icon.png
asar: true
asarUnpack:
  - node_modules/@napi-rs/**
npmRebuild: false
protocols:
  - name: RaSQL connection
    schemes: [rasql, mysql, mariadb, sqlite]
fileAssociations:
  - ext: rasql
    name: RaSQL connection
    role: Editor
  - ext: [sqlite, sqlite3, db, db3, s3db, sl3]
    name: SQLite database
    role: Editor
  - ext: spf
    name: Sequel Pro favorite
    role: Viewer
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # No Apple Developer account (docs/DECISIONS.md D-12): an ad-hoc signature over the whole bundle
  # ("-"), no notarization. Without it a quarantined download reads as damaged (D-38).
  identity: '-'
  hardenedRuntime: false
  darkModeSupport: true
dmg:
  sign: false
linux:
  executableName: rasql
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
  category: Development
  maintainer: Remon Pel
win:
  # The zip is what scripts/install-windows.ps1 installs from; the NSIS installer is for x64
  # downloads only. On arm64 the NSIS extractor drops .exe and .dll files (docs/DECISIONS.md D-30).
  target:
    - target: zip
      arch: [x64, arm64]
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
