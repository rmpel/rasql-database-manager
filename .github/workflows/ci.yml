name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # setup-node v5 would otherwise call pnpm for its cache before corepack has enabled it.
          package-manager-cache: false
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The UI suite runs on every OS: Windows runners have a desktop session, Linux gets a virtual one.
      - if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a pnpm test:e2e
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - if: matrix.os != 'ubuntu-latest'
        run: pnpm test:e2e
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - name: Upload UI test results on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-${{ matrix.os }}
          path: |
            packages/app/test-results
            packages/app/screenshots
          if-no-files-found: ignore
          retention-days: 7
      # Package for the runner's OS, both CPU types, so a broken installer shows up here and the
      # nightly release gets every variant. The target and arch matrix lives in electron-builder.yml.
      - name: Package
        run: pnpm --filter @rasql/app exec electron-builder --publish never
      # The install scripts are what people actually run; exercise each on its own OS.
      - name: Install script (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          scripts/install-mac.sh --no-launch
          test -x "$HOME/Applications/RaSQL.app/Contents/MacOS/RaSQL"
      - name: Install script (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          scripts/install-linux.sh --no-launch
          test -x "$HOME/.local/bin/RaSQL.AppImage"
          test -f "$HOME/.local/share/applications/rasql.desktop"
      - name: Install script (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/install-windows.ps1 -NoLaunch
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\RaSQL\RaSQL.exe")) { throw 'RaSQL.exe not installed' }
          if ((Get-ItemProperty 'HKCU:\Software\Classes\rasql\shell\open\command').'(default)' -notlike '*RaSQL.exe*') { throw 'rasql:// not registered' }
          if (-not (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\RaSQL' -ErrorAction SilentlyContinue)) { throw 'uninstall entry missing' }
          powershell -ExecutionPolicy Bypass -File "$env:LOCALAPPDATA\Programs\RaSQL\uninstall.ps1"
          Start-Sleep -Seconds 4
          if (Get-ItemProperty 'HKCU:\Software\Classes\rasql' -ErrorAction SilentlyContinue) { throw 'uninstall left the rasql:// registration' }
      - name: Upload package
        uses: actions/upload-artifact@v5
        with:
          name: rasql-${{ matrix.os }}
          path: |
            packages/app/release/*.dmg
            packages/app/release/*.zip
            packages/app/release/*.AppImage
            packages/app/release/*.deb
            packages/app/release/*.exe
          if-no-files-found: error
          retention-days: 14

  # A rolling pre-release, replaced on every push to master, with stable download links:
  # https://github.com/rmpel/rasql-database-manager/releases/tag/nightly
  nightly:
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: rasql-*
          path: dist
          merge-multiple: true
      - name: Drop files that are not downloads
        run: |
          cd dist
          rm -f *.blockmap *.yml *.yaml
          ls -la
      - name: Publish the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./packages/app/package.json').version")
          SHA=${GITHUB_SHA::7}
          NOTES=$(cat <<EOF
          Rolling pre-release built from \`$SHA\` on $(date -u +'%Y-%m-%d %H:%M UTC'). Replaced on every push to master.

          **Unsigned builds**: macOS blocks the first launch (System Settings, Privacy & Security, Open Anyway), Windows shows a SmartScreen prompt (More info, Run anyway). See docs/DECISIONS.md D-12.

          | Platform | File |
          | --- | --- |
          | macOS Apple Silicon | RaSQL-$VERSION-arm64.dmg |
          | macOS Intel | RaSQL-$VERSION-x64.dmg |
          | Windows x64 installer | RaSQL-$VERSION-x64.exe |
          | Windows ARM64 (zip, no installer: see D-30) | RaSQL-$VERSION-arm64.zip |
          | Linux x64 | RaSQL-$VERSION-x64.AppImage, RaSQL-$VERSION-x64.deb |
          | Linux ARM64 | RaSQL-$VERSION-arm64.AppImage, RaSQL-$VERSION-arm64.deb |

          Commit: $GITHUB_SHA
          EOF
          )
          # Recreate the release so the tag moves to this commit and stale assets disappear.
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly dist/* \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Nightly $VERSION ($SHA)" \
            --notes "$NOTES"

  engine-matrix:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # setup-node v5 would otherwise call pnpm for its cache before corepack has enabled it.
          package-manager-cache: false
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm matrix:up
      - run: pnpm test:matrix
      - if: always()
        run: pnpm matrix:down
