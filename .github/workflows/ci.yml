name: CI

on:
  push:
    branches: [main, master]
    # A version tag (v0.1.0) runs the same checks and then publishes a release and the cask.
    tags: ['v*']
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # setup-node v5 would otherwise call pnpm for its cache before corepack has enabled it.
          package-manager-cache: false
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The UI suite runs on every OS: Windows runners have a desktop session, Linux gets a virtual one.
      - if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a pnpm test:e2e
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - if: matrix.os != 'ubuntu-latest'
        run: pnpm test:e2e
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - name: Upload UI test results on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-${{ matrix.os }}
          path: |
            packages/app/test-results
            packages/app/screenshots
          if-no-files-found: ignore
          retention-days: 7
      # The install scripts are what people actually run; exercise each on its own OS. They rebuild
      # release/ for the host CPU only, so they run before the full Package step below.
      - name: Install script (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          scripts/install-mac.sh --no-launch
          test -x "$HOME/Applications/RaSQL.app/Contents/MacOS/RaSQL"
      - name: Install script (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          scripts/install-linux.sh --no-launch
          test -x "$HOME/.local/bin/RaSQL.AppImage"
          test -f "$HOME/.local/share/applications/rasql.desktop"
      - name: Install script (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/install-windows.ps1 -NoLaunch
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\RaSQL\RaSQL.exe")) { throw 'RaSQL.exe not installed' }
          if ((Get-ItemProperty 'HKCU:\Software\Classes\rasql\shell\open\command').'(default)' -notlike '*RaSQL.exe*') { throw 'rasql:// not registered' }
          if (-not (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\RaSQL' -ErrorAction SilentlyContinue)) { throw 'uninstall entry missing' }
          powershell -ExecutionPolicy Bypass -File "$env:LOCALAPPDATA\Programs\RaSQL\uninstall.ps1"
          Start-Sleep -Seconds 4
          if (Get-ItemProperty 'HKCU:\Software\Classes\rasql' -ErrorAction SilentlyContinue) { throw 'uninstall left the rasql:// registration' }
      # Package for the runner's OS, both CPU types, so a broken installer shows up here and the
      # nightly release gets every variant. The target and arch matrix lives in electron-builder.yml.
      - name: Package
        run: pnpm --filter @rasql/app exec electron-builder --publish never
      - name: Upload package
        uses: actions/upload-artifact@v5
        with:
          name: rasql-${{ matrix.os }}
          path: |
            packages/app/release/*.dmg
            packages/app/release/*.zip
            packages/app/release/*.AppImage
            packages/app/release/*.deb
            packages/app/release/*.exe
          if-no-files-found: error
          retention-days: 14

  # A rolling pre-release, replaced on every push to master, with stable download links:
  # https://github.com/rmpel/rasql-database-manager/releases/tag/nightly
  nightly:
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: rasql-*
          path: dist
          merge-multiple: true
      - name: Drop files that are not downloads
        run: |
          cd dist
          rm -f *.blockmap *.yml *.yaml
          ls -la
      - name: Publish the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./packages/app/package.json').version")
          SHA=${GITHUB_SHA::7}
          NOTES=$(cat <<EOF
          Rolling pre-release built from \`$SHA\` on $(date -u +'%Y-%m-%d %H:%M UTC'). Replaced on every push to master.

          **Unsigned builds**: macOS blocks the first launch (System Settings, Privacy & Security, Open Anyway), Windows shows a SmartScreen prompt (More info, Run anyway). See docs/DECISIONS.md D-12.

          | Platform | File |
          | --- | --- |
          | macOS Apple Silicon | RaSQL-$VERSION-mac-arm64.dmg |
          | macOS Intel | RaSQL-$VERSION-mac-x64.dmg |
          | Windows x64 installer | RaSQL-$VERSION-win-x64.exe |
          | Windows x64 or ARM64 without installer (unzip anywhere) | RaSQL-$VERSION-win-x64.zip, RaSQL-$VERSION-win-arm64.zip |
          | Linux x64 | RaSQL-$VERSION-linux-x64.AppImage, RaSQL-$VERSION-linux-x64.deb |
          | Linux ARM64 | RaSQL-$VERSION-linux-arm64.AppImage, RaSQL-$VERSION-linux-arm64.deb |

          File names in this table are the intended ones; check the asset list below for the exact spelling of the Linux architecture.

          Commit: $GITHUB_SHA
          EOF
          )
          # Recreate the release so the tag moves to this commit and stale assets disappear.
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly dist/* \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Nightly $VERSION ($SHA)" \
            --notes "$NOTES"

  # A versioned release for a v* tag, and the Homebrew cask for it (docs/DECISIONS.md D-38).
  release:
    runs-on: ubuntu-latest
    needs: [check, engine-matrix]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: rasql-*
          path: dist
          merge-multiple: true
      - name: Drop files that are not downloads
        run: |
          cd dist
          rm -f *.blockmap *.yml *.yaml
          ls -la
      - name: The tag must match the app version
        run: |
          VERSION=$(node -p "require('./packages/app/package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match packages/app/package.json version $VERSION"
            exit 1
          fi
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=${GITHUB_REF_NAME#v}
          NOTES=$(cat <<EOF
          **macOS with Homebrew**: \`brew install --cask rmpel/rasql/rasql\`

          **Unsigned builds**: macOS blocks the first launch (System Settings, Privacy & Security, Open Anyway), Windows shows a SmartScreen prompt (More info, Run anyway). See docs/DECISIONS.md D-12.

          | Platform | File |
          | --- | --- |
          | macOS Apple Silicon | RaSQL-$VERSION-mac-arm64.dmg |
          | macOS Intel | RaSQL-$VERSION-mac-x64.dmg |
          | Windows x64 installer | RaSQL-$VERSION-win-x64.exe |
          | Windows x64 or ARM64 without installer (unzip anywhere) | RaSQL-$VERSION-win-x64.zip, RaSQL-$VERSION-win-arm64.zip |
          | Linux x64 | RaSQL-$VERSION-linux-x86_64.AppImage, RaSQL-$VERSION-linux-amd64.deb |
          | Linux ARM64 | RaSQL-$VERSION-linux-arm64.AppImage, RaSQL-$VERSION-linux-arm64.deb |

          Commit: $GITHUB_SHA
          EOF
          )
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "RaSQL $VERSION" \
            --notes "$NOTES"
      - name: Update the Homebrew tap
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$TAP_DEPLOY_KEY" ]; then
            echo "::notice::No TAP_DEPLOY_KEY secret; run scripts/update-tap.sh ${GITHUB_REF_NAME#v} locally to update the tap."
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/tap_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          scripts/update-tap.sh "${GITHUB_REF_NAME#v}" dist

  engine-matrix:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # setup-node v5 would otherwise call pnpm for its cache before corepack has enabled it.
          package-manager-cache: false
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm matrix:up
      - run: pnpm test:matrix
      - if: always()
        run: pnpm matrix:down
