name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - if: matrix.os == 'macos-latest'
        run: pnpm test:e2e
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      # Package for the runner's own OS so a broken installer shows up here, not on a test machine.
      - name: Package
        run: pnpm --filter @rasql/app exec electron-builder --publish never
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: rasql-${{ matrix.os }}
          path: |
            packages/app/release/*.dmg
            packages/app/release/*.zip
            packages/app/release/*.AppImage
            packages/app/release/*.deb
            packages/app/release/*.exe
          if-no-files-found: error
          retention-days: 14

  engine-matrix:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm matrix:up
      - run: pnpm test:matrix
      - if: always()
        run: pnpm matrix:down
