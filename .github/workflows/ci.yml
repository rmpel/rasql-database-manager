name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # setup-node v5 would otherwise call pnpm for its cache before corepack has enabled it.
          package-manager-cache: false
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The UI suite runs on every OS: Windows runners have a desktop session, Linux gets a virtual one.
      - if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a pnpm test:e2e
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - if: matrix.os != 'ubuntu-latest'
        run: pnpm test:e2e
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - name: Upload UI test results on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-${{ matrix.os }}
          path: |
            packages/app/test-results
            packages/app/screenshots
          if-no-files-found: ignore
          retention-days: 7
      # Package for the runner's own OS so a broken installer shows up here, not on a test machine.
      - name: Package
        run: pnpm --filter @rasql/app exec electron-builder --publish never
      - name: Upload package
        uses: actions/upload-artifact@v5
        with:
          name: rasql-${{ matrix.os }}
          path: |
            packages/app/release/*.dmg
            packages/app/release/*.zip
            packages/app/release/*.AppImage
            packages/app/release/*.deb
            packages/app/release/*.exe
          if-no-files-found: error
          retention-days: 14

  engine-matrix:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # setup-node v5 would otherwise call pnpm for its cache before corepack has enabled it.
          package-manager-cache: false
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm matrix:up
      - run: pnpm test:matrix
      - if: always()
        run: pnpm matrix:down
